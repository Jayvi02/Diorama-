<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- Paper fibres and blotches -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.05" numOctaves="3" seed="7" result="fib"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="9" result="blot"/>
    <feComposite in="fib" in2="blot" operator="arithmetic" k2="0.5" k3="0.5"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.16  1.2 0 0 0 -0.45"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#p)"/>
</svg>
